
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RivetFlow Database Migration</title>
<style>
body {
  background: #0b1018;
  color: #f2f5f9;
  font-family: Arial, sans-serif;
  padding: 30px 18px;
}
main {
  max-width: 440px;
  margin: 60px auto;
  background: #121b27;
  border: 1px solid #263548;
  border-radius: 14px;
  padding: 24px;
}
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 14px;
  margin-top: 14px;
  border-radius: 8px;
  font-size: 16px;
}
input {
  background: #0b1018;
  border: 1px solid #35465b;
  color: white;
}
button {
  background: #2878e5;
  color: white;
  border: 0;
  font-weight: bold;
}
#result {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin-top: 18px;
}
</style>
</head>
<body>
<main>
  <h2>RivetFlow Migration</h2>
  <p>Enter your private authentication secret to prepare the database tables.</p>

  <input
    id="secret"
    type="password"
    placeholder="BETTER_AUTH_SECRET"
    autocomplete="off"
  >

  <button id="run" onclick="runMigration()">
    Run Database Migration
  </button>

  <div id="result"></div>
</main>

<script>
async function runMigration() {
  const secret = document.getElementById("secret").value;
  const result = document.getElementById("result");
  const button = document.getElementById("run");

  if (!secret) {
    result.textContent = "Please enter your secret.";
    return;
  }

  button.disabled = true;
  result.textContent = "Running migration...";

  try {
    const response = await fetch("/api/auth-migrate", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + secret
      }
    });

    const data = await response.json();

    result.textContent = JSON.stringify(data, null, 2);
  } catch (error) {
    result.textContent = "Request failed. Please check the deployment.";
  } finally {
    document.getElementById("secret").value = "";
    button.disabled = false;
  }
}
</script>
</body>
</html>
